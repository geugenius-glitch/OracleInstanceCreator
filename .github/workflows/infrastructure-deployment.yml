name: Deploy OCI Infrastructure (Parallel Orchestration)

on:
  workflow_dispatch:
    inputs:
      send_notifications:
        description: 'Send Telegram notifications'
        required: false
        type: boolean
        default: true
      check_existing_instance:
        description: 'Check for existing instances before launching'
        required: false
        type: boolean
        default: true
      reset_success_state:
        description: 'Reset success state and run even if previously successful'
        required: false
        type: boolean
        default: false

env:
  ENABLE_NOTIFICATIONS: ${{ github.event_name == 'workflow_dispatch' && (inputs.send_notifications && 'true' || 'false') || 'true' }}
  CHECK_EXISTING_INSTANCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.check_existing_instance && 'true' || 'false') || 'true' }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: true
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_ID }}
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_ID }}

jobs:
  create-instance:
    if: ${{ github.event.repository.vars.INSTANCE_CREATED != 'true' || inputs.reset_success_state }}
    runs-on: ubuntu-latest
    name: Deploy OCI Infrastructure (Parallel Orchestration)
    permissions:
      contents: read
    outputs:
      script_exit_code: ${{ steps.launch-instances.outputs.script_exit_code }}
    
    env:
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_ID }}
      COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Export OCI Environment Variables
        run: |
          echo "OCI_COMPARTMENT_ID=${{ secrets.OCI_COMPARTMENT_ID }}" >> $GITHUB_ENV
          echo "OCI_COMPARTMENT_OCID=${{ secrets.OCI_COMPARTMENT_ID }}" >> $GITHUB_ENV
          echo "COMPARTMENT_ID=${{ secrets.OCI_COMPARTMENT_ID }}" >> $GITHUB_ENV
          echo "COMPARTMENT_OCID=${{ secrets.OCI_COMPARTMENT_ID }}" >> $GITHUB_ENV

      - name: Setup OCI CLI & Launch Instances
        id: launch-instances
        run: |
          chmod +x ./launch.sh
          ./launch.sh
